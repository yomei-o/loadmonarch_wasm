<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lord Monarch - a port in progress</title>
<style>
  :root {
    --bg: #10120e;
    --line: #33392a;
    --ink: #d8dfc8;
    --muted: #8c9678;
    --gold: #d8b44a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.55 "Consolas", "Roboto Mono", monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #1e2219, #14170f);
  }
  header .brand { color: var(--gold); font-weight: bold; letter-spacing: 2px; }
  header .brand small { color: var(--muted); letter-spacing: 0; margin-left: 8px; font-weight: normal; }
  button, label.filebtn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 5px 11px;
    font: inherit;
    cursor: pointer;
    user-select: none;
  }
  button:hover, label.filebtn:hover { border-color: var(--gold); color: var(--gold); }
  button.on { background: var(--gold); border-color: var(--gold); color: #241d05; }
  button:disabled { opacity: .4; cursor: default; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; min-height: 240px;
           display: grid; place-items: center; background: #070a06; }
  #view { image-rendering: pixelated; max-width: 100%; max-height: 100%; }
  #drop {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    text-align: center; padding: 24px;
    background: rgba(7, 10, 6, .94);
  }
  #drop.hide { display: none; }
  #drop .box {
    border: 2px dashed var(--line);
    border-radius: 6px;
    padding: 32px 40px;
    max-width: 640px;
  }
  #drop.over .box { border-color: var(--gold); }
  #drop h1 { font-size: 20px; margin: 0 0 6px; color: var(--gold); letter-spacing: 1px; }
  #drop p { color: var(--muted); margin: 8px 0; }
  #drop code { color: var(--ink); }
  #note { color: var(--gold); }
</style>
</head>
<body>
<!--
  Everything the game does is drawn by the port itself, in the one canvas, out
  of the executable's own art: the menu bar, the tool bar, the dialogs, the
  order menu and the three windows.  What is left up here is the little a page
  has to own - which release to fetch, and a purse to fill when trying a stage
  out.  Nothing else belongs to the page any more.
-->
<header>
  <span class="brand">LORD MONARCH<small>移植途中 / a port in progress</small><small
        id="build" title="このページのビルド刻印。新しいビルドが出ると自分で乗り換えます"></small></span>
  <button id="langE" class="on">English</button>
  <button id="langJ">日本語</button>
  <label class="filebtn">zip を開く<input type="file" id="file" accept=".zip" hidden></label>
  <span class="sep"></span>
  <button id="cashBtn" disabled title="原作にはありません。試すため用">金MAX</button>
  <span id="note"></span>
</header>
<main>
  <div id="stage">
    <canvas id="view" width="640" height="480"></canvas>
    <div id="drop">
      <div class="box">
        <h1 id="dropTitle">読み込んでいます…</h1>
        <p id="dropText">Nihon Falcom の「Lord Monarch Online」を読み込んで動かします。
           配布中の <code>ds7e.zip</code> をこのページが取りに行きます。</p>
        <p>お手元の zip を落とせばそちらを読みます。ファイルはブラウザの中だけで
           扱われ、どこにも送られません。</p>
      </div>
    </div>
  </div>
</main>

<script src="loadmonarch.js?v=20260903075151"></script>
<script>
createLordMonarch().then(function (M) {
  'use strict';
  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d');
  var drop = document.getElementById('drop');
  var note = document.getElementById('note');
  var loaded = false;
  var said = false;      // the stage's verdict, announced once

  // Which build this page is, and whether a newer one is up.  The stamp is
  // written in by tools/build_wasm.sh, and docs/version.txt carries the same
  // one - so asking for that file past the cache says whether what is loaded
  // is current.  It is not, often: GitHub Pages serves this page with
  // max-age=600 and the module's cache buster is inside the page, so a cached
  // page pins a cached module and a fresh push looks like no push at all.
  var BUILD = '20260903075151';
  var buildTag = document.getElementById('build');
  buildTag.textContent = BUILD.slice(0, 8) + '.' + BUILD.slice(8);

  function checkBuild() {
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (text) {
          if (!text) return;
          var live = text.trim();
          if (!live || live === BUILD) return;
          // A query the browser has not seen is a document it has to fetch.
          location.replace(location.pathname + '?v=' + live);
        })
        .catch(function () {});          // opened from a file:// path
  }
  if (BUILD.charAt(0) !== '_') {         // not a build, so nothing to compare
    checkBuild();
    setInterval(checkBuild, 60000);
  }

  function say(text) {
    note.textContent = text;
    setTimeout(function () { note.textContent = ''; }, 2000);
  }

  // As much view as the window can show, up to the whole 48-cell map at the
  // middle zoom.  The original's is fixed at what a 1997 screen had.
  var W, H;
  function fitView() {
    var stage = document.getElementById('stage');
    var w = Math.max(320, Math.min(800, Math.floor(stage.clientWidth)));
    var bar = M._lm_bar_height ? M._lm_bar_height() : 0;
    var h = Math.max(240, Math.min(780, Math.floor(stage.clientHeight) - bar));
    M._lm_set_view(w, h);
    W = M._lm_width();
    H = M._lm_height();
    canvas.width = W;
    canvas.height = H;
  }
  fitView();
  window.addEventListener('resize', function () { if (loaded) fitView(); });

  // The whole frame comes out of the port already resolved to RGBA - board,
  // bars, windows, dialogs, the order menu, the rubber band and whatever
  // picture is up.  All this does is hand it to the canvas.
  function present() {
    var ptr = M._lm_frame();
    var img = new ImageData(
        new Uint8ClampedArray(M.HEAPU8.buffer, ptr, W * H * 4).slice(), W, H);
    ctx.putImageData(img, 0, 0);
  }

  /* ------------------------------------------------------- loading a zip */
  // Falcom still give the game away at falcom.co.jp/monarch, and the two
  // releases sit beside this page, so it loads one by itself and a player only
  // has to drop a file if they would rather use their own copy.  A File and a
  // fetched Response both answer arrayBuffer(), so this takes either.
  function openZip(file) {
    return file.arrayBuffer().then(function (buffer) {
      var bytes = new Uint8Array(buffer);
      var p = M._lm_alloc(bytes.length);
      M.HEAPU8.set(bytes, p);
      var stages = M._lm_open_zip(p, bytes.length);
      M._lm_free(p);
      if (!stages) {
        note.textContent = M.UTF8ToString(M._lm_message());
        return;
      }
      note.textContent = '';
      loaded = true;
      drop.classList.add('hide');
      document.getElementById('cashBtn').disabled = false;
      canvas.focus();
      fitView();
      // The opening picture is up already - lm_open_zip puts it there - and a
      // click anywhere puts it away.  The stage under it is laid out and
      // stopped, waiting for Go on the tool bar, which is where the original
      // leaves it too.
      // Opening the zip is a user gesture, which is the one thing a browser
      // insists on before it will make a sound - so the music starts here
      // rather than waiting to be asked.
      startMusic();
    });
  }

  function showPicture(stem) {
    var name = M._lm_alloc(stem.length + 1);
    for (var i = 0; i < stem.length; i++)
      M.HEAPU8[name + i] = stem.charCodeAt(i);
    M.HEAPU8[name + stem.length] = 0;
    var ok = M._lm_picture_show(name);
    M._lm_free(name);
    return ok;
  }

  document.getElementById('file').onchange = function (e) {
    if (e.target.files[0]) openZip(e.target.files[0]);
    e.target.value = '';
  };

  var langE = document.getElementById('langE');
  var langJ = document.getElementById('langJ');
  var dropTitle = document.getElementById('dropTitle');
  var dropText = document.getElementById('dropText');

  function fetchRelease(which) {
    langE.classList.toggle('on', which === 'e');
    langJ.classList.toggle('on', which === 'j');
    var name = which === 'j' ? 'ds7j.zip' : 'ds7e.zip';
    if (!loaded) dropTitle.textContent = '読み込んでいます…';
    note.textContent = '';
    fetch('../' + name).then(function (response) {
      if (!response.ok) throw new Error(response.status + ' ' + name);
      return openZip(response);
    }).catch(function (error) {
      // Opened from a file:// path, or the release is not beside the page.
      dropTitle.textContent = 'zip をここに落としてください';
      dropText.textContent = 'ページから ' + name +
          ' を取れませんでした (' + error.message + ')。' +
          'お手元の zip を落とすか、上のボタンから開いてください。';
    });
  }
  langE.onclick = function () { fetchRelease('e'); };
  langJ.onclick = function () { fetchRelease('j'); };

  ['dragenter', 'dragover'].forEach(function (t) {
    document.addEventListener(t, function (e) {
      e.preventDefault();
      drop.classList.add('over');
      drop.classList.remove('hide');
    });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    document.addEventListener(t, function (e) {
      e.preventDefault();
      drop.classList.remove('over');
      if (loaded) drop.classList.add('hide');
    });
  });
  document.addEventListener('drop', function (e) {
    var file = e.dataTransfer.files[0];
    if (file) openZip(file);
  });

  // Not in the original: a purse filled, so a stage can be tried without
  // playing the first half of it first.
  document.getElementById('cashBtn').onclick = function () {
    M._lm_cheat_funds();
    say('資金を満たしました');
  };

  /* ------------------------------------------------------- the save slots */
  // The dialogs are the game's own and live in the canvas; only the bytes are
  // the page's, because localStorage is the one thing C cannot reach.
  var SLOT_KEY = 'lord-monarch-save-slot';

  function slotLoadNames() {
    for (var i = 0; i < M._lm_slot_count(); i++) {
      var raw = null;
      try { raw = localStorage.getItem(SLOT_KEY + i + '-name'); } catch (e) {}
      var p = M._lm_alloc(64);
      writeName(p, raw || '');
      M._lm_slot_set_name(i, p);
      M._lm_free(p);
    }
  }

  // A short ASCII name into the port's heap.  The names are the player's own,
  // so anything outside ASCII is dropped rather than mangled.
  function writeName(ptr, text) {
    var n = 0;
    for (var i = 0; i < text.length && n < 38; i++) {
      var c = text.charCodeAt(i);
      if (c >= 32 && c < 127) M.HEAPU8[ptr + n++] = c;
    }
    M.HEAPU8[ptr + n] = 0;
  }

  // Whatever the dialog asked for: read a slot, write one, or drop one.
  function slotService() {
    var what = M._lm_slot_action();
    if (!what) return;
    var slot = M._lm_slot_wanted();
    if (what === 1) {
      var raw = null;
      try { raw = localStorage.getItem(SLOT_KEY + slot); } catch (e) {}
      if (!raw) { say('その枠は空です'); return; }
      var bytes = Uint8Array.from(atob(raw), function (c) {
        return c.charCodeAt(0);
      });
      var p = M._lm_alloc(bytes.length);
      M.HEAPU8.set(bytes, p);
      var ok = M._lm_load(p, bytes.length);
      M._lm_free(p);
      said = false;
      say(ok ? (slot + 1) + ' 番から再開しました' : 'その枠は読めません');
    } else if (what === 2) {
      var ptr = M._lm_save();
      var size = M._lm_save_size();
      var out = new Uint8Array(M.HEAPU8.buffer, ptr, size);
      var text = '';
      for (var i = 0; i < size; i += 0x8000)
        text += String.fromCharCode.apply(
            null, out.subarray(i, Math.min(i + 0x8000, size)));
      try {
        localStorage.setItem(SLOT_KEY + slot, btoa(text));
        localStorage.setItem(SLOT_KEY + slot + '-name',
                             '面' + (M._lm_stage() + 1) + ' ' +
                             M._lm_days() + '日');
      } catch (e) { say('保存できません'); return; }
      slotLoadNames();
      say((slot + 1) + ' 番に保存しました');
    } else if (what === 3) {
      try {
        localStorage.removeItem(SLOT_KEY + slot);
        localStorage.removeItem(SLOT_KEY + slot + '-name');
      } catch (e) {}
      say((slot + 1) + ' 番を消しました');
    }
  }

  // What the host still owns of MENU 101: opening a dialog, and putting the
  // windows back where they belong.  Everything else the port does itself.
  function hostCommand(id) {
    if (M._lm_dialog_open(id)) { slotLoadNames(); return; }
    if (id === 40111) { fitView(); return; }
  }

  /* ------------------------------------------------------------- pointer */
  function viewPoint(e) {
    var r = canvas.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) * canvas.width / r.width),
            Math.floor((e.clientY - r.top) * canvas.height / r.height)];
  }

  var panning = null;
  var sliding = false;          // dragging one of the Progress Window's strips
  var dragFrom = null;          // a left-drag gathers an army
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  canvas.addEventListener('pointerdown', function (e) {
    if (!loaded) return;
    // A picture is over everything, and a click anywhere puts it away.
    if (M._lm_picture_up()) {
      M._lm_picture_dismiss();
      e.preventDefault();
      return;
    }
    // A dialog is modal: while one is up nothing else sees the pointer.
    if (M._lm_dialog_up()) {
      var q = viewPoint(e);
      M._lm_dialog_click(q[0], q[1]);
      slotService();
      e.preventDefault();
      return;
    }
    // The menu bar and the tool bar are the game's own, drawn in the canvas:
    // a click there never reaches the map.
    var b = viewPoint(e);
    var cmd = M._lm_bar_click(b[0], b[1]);
    if (cmd >= 0) {
      if (cmd > 0 && !M._lm_command(cmd)) hostCommand(cmd);
      e.preventDefault();
      return;
    }
    // The column of windows down the right is windows: a click there does not
    // reach the board - and the Progress Window's two strips are draggable,
    // which is how the tax and the clock are set by hand.  Touching the tax
    // turns the automatic one off, as it does in the original.
    if (M._lm_panel_hit(b[0], b[1])) {
      var slider = M._lm_panel_drag(b[0], b[1]);
      if (slider) {
        sliding = true;
        canvas.setPointerCapture(e.pointerId);
        if (slider === 1) say('税率を手で決めました（自動課税は切れます）');
      }
      e.preventDefault();
      return;
    }
    if (M._lm_menu_up()) {
      M._lm_menu_click(b[0], b[1]);
      e.preventDefault();
      return;
    }
    // 00424a10: the right button drags the map about.  A right button that
    // does not move is the other thing it does - it brings up the order menu
    // on the square under it - so which of the two this is cannot be known
    // until the button comes back up.
    if (e.button === 2 || e.button === 1) {
      panning = { x: e.clientX, y: e.clientY, from: b, moved: false };
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
      return;
    }
    dragFrom = b;
    M._lm_drag_rect(1, b[0], b[1], b[0], b[1]);
    canvas.setPointerCapture(e.pointerId);
  });

  // The left button chooses, the right button orders:
  //
  //   left drag over the map     gather every unit of yours inside it
  //   left click on a unit       choose that one
  //   right click                the order menu on that square
  //   right drag                 scroll the map, which is 00424a10's own job
  //
  // Both ways of choosing are deliberate, so both pick a unit up even when it
  // already carries an order - 00409e90 rather than 00409f10.  Shift adds to
  // what is already chosen.
  //
  // A left click on bare ground used to put a settlement down for a hundred
  // gold, which is not in the game: 0041eb60 is a unit's own build action and
  // it spends up to two hundred of that unit's strength, so the page was
  // quietly feeding the player's king into the ground every time they clicked
  // an empty square.  Building is what the order menu's own build order is
  // for.
  function finishDrag(e) {
    var p = viewPoint(e);
    var moved = dragFrom &&
        (Math.abs(p[0] - dragFrom[0]) > 6 || Math.abs(p[1] - dragFrom[1]) > 6);
    M._lm_drag_rect(0, 0, 0, 0, 0);

    if (moved) {
      if (!e.shiftKey) M._lm_clear_selection();
      M._lm_select_rect(dragFrom[0], dragFrom[1], p[0], p[1], 1);
    } else if (M._lm_unit_here(p[0], p[1])) {
      if (!e.shiftKey) M._lm_clear_selection();
      M._lm_select_at(p[0], p[1], 1);
    } else if (!e.shiftKey) {
      M._lm_clear_selection();
    }
    dragFrom = null;
  }

  canvas.addEventListener('pointerup', function (e) {
    if (sliding) { sliding = false; e.preventDefault(); return; }
    if (panning) {
      // A right button that never moved is an order, not a scroll.  00423940
      // puts the menu up where the pointer is and offers only what that
      // square accepts - click water and the one thing on it is a bridge.
      if (!panning.moved && M._lm_selected() > 0)
        M._lm_menu_open(panning.from[0], panning.from[1]);
      panning = null;
      e.preventDefault();
      return;
    }
    if (dragFrom) finishDrag(e);
  });
  canvas.addEventListener('pointercancel', function () {
    dragFrom = null;
    M._lm_drag_rect(0, 0, 0, 0, 0);
  });
  canvas.addEventListener('wheel', function (e) {
    if (!loaded) return;
    M._lm_scroll_by(e.shiftKey ? Math.round(e.deltaY) : 0,
                    e.shiftKey ? 0 : Math.round(e.deltaY));
    e.preventDefault();
  }, { passive: false });

  // The cursor follows the pointer, as sprite 0xcc laid on the cell - and with
  // units chosen, each of them answers in its balloon whether it can get to
  // where the pointer is.
  var aimCol = -1, aimRow = -1;
  canvas.addEventListener('pointermove', function (e) {
    if (!loaded) return;
    if (panning) {
      var r = canvas.getBoundingClientRect();
      var scale = canvas.width / r.width;
      var dx = panning.x - e.clientX, dy = panning.y - e.clientY;
      if (Math.abs(dx) > 2 || Math.abs(dy) > 2) panning.moved = true;
      M._lm_scroll_by(Math.round(dx * scale), Math.round(dy * scale));
      panning.x = e.clientX;
      panning.y = e.clientY;
      return;
    }
    var p = viewPoint(e);
    if (sliding) { M._lm_panel_drag(p[0], p[1]); return; }
    if (M._lm_picture_up()) return;
    if (M._lm_dialog_up()) { M._lm_dialog_hover(p[0], p[1]); return; }
    if (M._lm_bar_hover(p[0], p[1])) return;
    if (M._lm_menu_up()) { M._lm_menu_hover(p[0], p[1]); return; }
    if (dragFrom) M._lm_drag_rect(1, dragFrom[0], dragFrom[1], p[0], p[1]);
    M._lm_set_cursor(p[0], p[1]);
    if (!dragFrom && M._lm_selected() > 0) {
      var col = M._lm_cursor_col(), row = M._lm_cursor_row();
      if (col !== aimCol || row !== aimRow) {
        aimCol = col;
        aimRow = row;
        M._lm_aim(p[0], p[1]);
      }
    }
  });
  canvas.addEventListener('pointerleave', function () {
    if (loaded) M._lm_set_cursor(-1, -1);
  });

  // The map is 48 cells across and the window shows a part of it, so the
  // arrows and the wheel scroll.  Everything else goes through the game's own
  // menus, which is where the original has it.
  document.addEventListener('keydown', function (e) {
    if (!loaded) return;
    var moves = {
      ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      ArrowUp: [0, -1], ArrowDown: [0, 1],
    };
    if (moves[e.key]) {
      M._lm_scroll(moves[e.key][0], moves[e.key][1]);
      e.preventDefault();
    }
  });

  /* --------------------------------------------------------------- music */
  // There is no synthesiser in a browser, so the tune is rendered in C and
  // this only moves the samples to the speakers.  The context is created
  // inside the click that starts it - a context made any earlier begins
  // suspended and never makes a sound, which is the trap the simtower port
  // spent an afternoon on.
  var audio = null, node = null, musicOn = false;
  // 0040a110 chooses between a stage's two tunes by how the war is going, and
  // leaves the one that is playing alone in between.  0 is the opening tune,
  // which is what plays before a stage is under way.
  var playing = 0;

  function followTheWar() {
    if (!musicOn) return;
    var want = M._lm_music_wanted();
    if (want < 0 || want === playing) return;
    playing = want;
    M._lm_music_play(playing, M._lm_tune_loops(playing));
  }

  function startMusic() {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audio) {
      audio = new Ctx();
      // Should the context still come up suspended - some browsers only trust
      // certain gestures - let the next one revive it.
      var revive = function () {
        if (audio && audio.state === 'suspended') audio.resume();
      };
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (type) {
        document.addEventListener(type, revive, true);
      });
    }
    if (audio.state === 'suspended') audio.resume();
    // The synthesiser builds its wavetables from the rate, so it has to be
    // told before the tune is loaded rather than at render time.
    M._lm_music_rate(audio.sampleRate | 0);
    if (!M._lm_music_play(playing, 1)) return;
    // A ScriptProcessor is deprecated but needs no separate module file,
    // which keeps this page a single file the way the rest of it is.
    node = audio.createScriptProcessor(2048, 0, 2);
    var cap = M._lm_music_capacity2();
    node.onaudioprocess = function (e) {
      var l = e.outputBuffer.getChannelData(0);
      var r = e.outputBuffer.getChannelData(1);
      var frames = Math.min(l.length, cap);
      var ptr = M._lm_music_render2(frames, audio.sampleRate | 0);
      var left = new Float32Array(M.HEAPU8.buffer, ptr, frames);
      var right = new Float32Array(M.HEAPU8.buffer, ptr + cap * 4, frames);
      l.set(left.subarray(0, Math.min(frames, l.length)));
      r.set(right.subarray(0, Math.min(frames, r.length)));
      if (frames < l.length) { l.fill(0, frames); r.fill(0, frames); }
      if (!M._lm_music_playing()) M._lm_music_play(playing, 1);
    };
    node.connect(audio.destination);
    musicOn = true;
  }

  /* ---------------------------------------------------------------- loop */
  //
  // The original's pace.  Its message loop runs a tick only when a counter has
  // reached zero, and a 16-millisecond multimedia timer is what counts it down:
  //
  //     if (DAT_004344e0 == 0) { DAT_004344e0 = 0x1e - speed; tick(); }
  //
  // So a tick is (30 - speed) sixteenths of a second, and the speed setting
  // starts at 25 - four ticks a second, not sixty.  The setting itself lives in
  // the port, where the Progress Window's lower strip and System Setting both
  // reach it.
  var nextTick = 0;
  function tickInterval() { return (30 - M._lm_speed()) * 16; }

  var lastHost = 0;
  function frame(now) {
    if (loaded) {
      if (now >= nextTick) {
        M._lm_step(1);
        nextTick = now + tickInterval();
      }
      present();
      // The few things the page has to keep an eye on, four times a second.
      if (now - lastHost > 250) {
        lastHost = now;
        M._lm_update_areas();       // 0041b640, for the windows
        followTheWar();             // 0040a110
        // 0041f4c0 says when a stage is over: the game's own ending picture
        // for a win, the interlude for a loss, and its own tunes for them -
        // SOUND.CFG entry 2 is "Winner!", 3 is "Game Over", neither loops.
        var over = M._lm_outcome();
        if (over && !said) {
          said = true;
          showPicture(over === 1 ? 'END' : 'GAKU');
          if (musicOn) {
            playing = over === 1 ? 2 : 3;
            M._lm_music_play(playing, M._lm_tune_loops(playing));
          }
        }
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Nothing has been clicked yet, so the browser will hold the sound until the
  // first gesture - startMusic's revive listener picks it up then.
  fetchRelease('e');
});
</script>

</html>
